# encoding: utf-8
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflow-watch
  namespace: infra
  labels:
    app: kubeflow-watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeflow-watch
  template:
    metadata:
      name: kubeflow-watch
      labels:
        app: kubeflow-watch
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubeflow-dashboard
                operator: In
                values:
                - "true"
      volumes:
        - name: tz-config
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
        - name: kubeflow-dashboard-config
          configMap:
            name: kubeflow-dashboard-config
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
              - key: config.py
                path: config.py
              - key: project.py
                path: project.py
        - name: kubernetes-config
          configMap:
            name: kubernetes-config

      serviceAccountName: kubeflow-dashboard
      imagePullSecrets:
        - name: hubsecret
      # P1: 启动前等待 MySQL 和 Redis 就绪，避免启动失败
      initContainers:
        - name: wait-for-mysql
          image: 192.168.11.12/cube-studio/busybox:1.36.0
          command:
          - sh
          - -c
          - |
            echo "Waiting for MySQL..."
            until nc -z $(echo $MYSQL_SERVICE | sed -n 's/.*@\([^:]*\):\([0-9]*\).*/\1 \2/p' | awk '{print $1}') $(echo $MYSQL_SERVICE | sed -n 's/.*@\([^:]*\):\([0-9]*\).*/\1 \2/p' | awk '{print $2}') 2>/dev/null; do
              sleep 2
            done
            echo "MySQL is ready."
          env:
          - name: MYSQL_SERVICE
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: MYSQL_SERVICE
        - name: wait-for-redis
          image: 192.168.11.12/cube-studio/busybox:1.36.0
          command:
          - sh
          - -c
          - |
            echo "Waiting for Redis..."
            until nc -z $REDIS_HOST $REDIS_PORT 2>/dev/null; do
              sleep 2
            done
            echo "Redis is ready."
          env:
          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_HOST
          - name: REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_PORT
      containers:
        - name: kubeflow-watch-workflow
          image: 192.168.11.12/cube-studio/kubeflow-dashboard:kylin-20260730-v6
          imagePullPolicy: Always  # IfNotPresent
          workingDir: /home/myapp
          command: ["supervisord", "-c", "/home/myapp/myapp/tools/supervisord.conf"]
          env:
          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_HOST
          - name: REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_PORT
          - name: REDIS_PASSWORD
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_PASSWORD
          - name: MYSQL_SERVICE
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: MYSQL_SERVICE
          - name: ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: ENVIRONMENT
          volumeMounts:
            - name: kubeflow-dashboard-config
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
            - name: kubeflow-dashboard-config
              mountPath: /home/myapp/myapp/config.py
              subPath: config.py
            - name: kubeflow-dashboard-config
              mountPath: /home/myapp/myapp/project.py
              subPath: project.py
            - name: tz-config
              mountPath: /etc/localtime
            - name: kubernetes-config
              mountPath: /home/myapp/kubeconfig
          livenessProbe:
            failureThreshold: 1
            exec:
              command: ["bash","-c","hour=`date +%H`; if [ $hour -eq 03 ]; then exit 1; fi"]
            initialDelaySeconds: 3600
            periodSeconds: 3600
            timeoutSeconds: 3600
