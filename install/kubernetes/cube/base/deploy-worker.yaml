# encoding: utf-8
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflow-dashboard-worker
  namespace: infra
  labels:
    app: kubeflow-dashboard-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kubeflow-dashboard-worker
  template:
    metadata:
      name: kubeflow-dashboard-worker
      labels:
        app: kubeflow-dashboard-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: kubeflow-dashboard-worker
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubeflow-dashboard
                operator: In
                values:
                - "true"
      volumes:
        - name: tz-config
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
        - name: kubeflow-dashboard-config
          configMap:
            name: kubeflow-dashboard-config
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
              - key: config.py
                path: config.py
              - key: project.py
                path: project.py
        - name: kubernetes-config
          configMap:
            name: kubernetes-config
        - name: infra-kubeflow
          persistentVolumeClaim:
            claimName: infra-kubeflow
      serviceAccountName: kubeflow-dashboard
      imagePullSecrets:
        - name: hubsecret
      # P1: 启动前等待 MySQL 和 Redis 就绪，避免启动失败
      initContainers:
        - name: wait-for-mysql
          image: 192.168.11.12/cube-studio/busybox:1.36.0
          command:
          - sh
          - -c
          - |
            echo "Waiting for MySQL..."
            until nc -z $(echo $MYSQL_SERVICE | sed -n 's/.*@\([^:]*\):\([0-9]*\).*/\1 \2/p' | awk '{print $1}') $(echo $MYSQL_SERVICE | sed -n 's/.*@\([^:]*\):\([0-9]*\).*/\1 \2/p' | awk '{print $2}') 2>/dev/null; do
              sleep 2
            done
            echo "MySQL is ready."
          env:
          - name: MYSQL_SERVICE
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: MYSQL_SERVICE
        - name: wait-for-redis
          image: 192.168.11.12/cube-studio/busybox:1.36.0
          command:
          - sh
          - -c
          - |
            echo "Waiting for Redis..."
            until nc -z $REDIS_HOST $REDIS_PORT 2>/dev/null; do
              sleep 2
            done
            echo "Redis is ready."
          env:
          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_HOST
          - name: REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_PORT
      containers:
        - name: kubeflow-dashboard-worker
          image: 192.168.11.12/cube-studio/kubeflow-dashboard:kylin-20260730-v6
          imagePullPolicy: Always
          command: ["bash","-c",'celery --app=myapp.tasks.celery_app:celery_app worker --loglevel=info --pool=prefork -Ofair -c 20 -n worker@%h']
          resources:       
            limits:
              cpu: 6
              memory: 12Gi
            requests:
              cpu: 100m
              memory: 1Gi
          env:
          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_HOST
          - name: REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_PORT
          - name: REDIS_PASSWORD
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: REDIS_PASSWORD
          - name: MYSQL_SERVICE
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: MYSQL_SERVICE
          - name: ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: deploy-config
                key: ENVIRONMENT
          volumeMounts:
            - name: kubeflow-dashboard-config
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
            - name: kubeflow-dashboard-config
              mountPath: /home/myapp/myapp/config.py
              subPath: config.py
            - name: kubeflow-dashboard-config
              mountPath: /home/myapp/myapp/project.py
              subPath: project.py
            - name: tz-config
              mountPath: /etc/localtime
            - name: kubernetes-config
              mountPath: /home/myapp/kubeconfig
            - name: infra-kubeflow
              mountPath: /data/k8s/kubeflow/

          livenessProbe:
            failureThreshold: 3
            exec:
              command:
              - bash
              - -c
              - celery -A myapp.tasks.celery_app:celery_app inspect ping -d worker@$HOSTNAME 2>/dev/null | grep -q 'OK'
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10