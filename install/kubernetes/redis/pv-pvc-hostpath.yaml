---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: infra-redis-pv
  labels:
    infra-pvname: infra-redis-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /data/k8s/infra/redis
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: infra-redis-pvc
  namespace: infra
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: infra-redis-pv
  storageClassName: ""
